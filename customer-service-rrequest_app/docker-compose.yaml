version: "3.9"

services:

  frontend:
    build:
      context: ./
    container_name: customer-service-request_app
    ports:
      - "5173:80"
    depends_on:
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data: